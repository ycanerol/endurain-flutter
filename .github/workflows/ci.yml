name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Keep in sync with docker/flutter-build/Dockerfile and the image workflow.
  FLUTTER_VERSION: 3.47.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel verification of a commit that has landed on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze Dart code
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: >-
          dart run tool/check_coverage.dart
          --min-line-coverage 80
          --min-file-line-coverage 60
          --exclude 'lib/l10n/app_localizations*.dart'
          --exclude 'lib/core/theme/app_theme_tokens.dart'
          --exclude 'lib/core/navigation/app_routes.dart'
          --exclude 'lib/shared/widgets/app_bottom_nav.dart'
          --exclude 'lib/core/services/platform/*.dart'
          --exclude 'lib/features/health/services/health_package_platform_adapter.dart'
          --exclude 'lib/features/sensors/services/universal_ble_sensor_connection_adapter.dart'

  android-unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generate Gradle config
        shell: bash
        run: flutter build apk --config-only

      - name: Initialize Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --version --console=plain; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "Gradle wrapper download attempt $attempt failed; retrying"
          done

      - name: Run native Kotlin unit tests
        shell: bash
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Debug signing keeps this gate safe for forks and pull requests.
      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug --target-platform android-arm64

  ios-test:
    name: iOS build and unit tests
    # The Linux jobs run in the CI builder image; macOS runners cannot use
    # container jobs, so Flutter is checked out at the pinned version instead.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generate Xcode config
        shell: bash
        run: flutter build ios --simulator --debug --config-only

      # Pick an available iPhone simulator instead of hard-coding a model,
      # since runner images change which simulators they ship.
      - name: Run native XCTests
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r \
            '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $udid"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO
